name: Deploy to Render on push
# Render's GitHub App wasn't triggering deploys for this repo (nothing deployed since
# 2026-05-04). This triggers a Render deploy on every push to main via the Render API.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (ledgeman-marketing)
        run: |
          set -e
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-d6tidh7afjfc73fis6e0/deploys" \
            -d '{"clearCache":"do_not_clear"}'
          echo "Render deploy triggered for ledgeman-marketing"
